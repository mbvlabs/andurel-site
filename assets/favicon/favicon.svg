<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Matches the 32px BrandMark: 1px #52605c frame, #101414 fill, 4px padding/gap, 9px cells. -->
  <rect width="32" height="32" fill="#52605c"/>
  <rect x="1" y="1" width="30" height="30" fill="#101414"/>
  <!-- top-left: mint outline -->
  <rect x="5" y="5" width="9" height="9" fill="#8df7a4"/>
  <rect x="6" y="6" width="7" height="7" fill="#101414"/>
  <!-- top-right: muted outline -->
  <rect x="18" y="5" width="9" height="9" fill="#52605c"/>
  <rect x="19" y="6" width="7" height="7" fill="#101414"/>
  <!-- bottom-left: muted outline -->
  <rect x="5" y="18" width="9" height="9" fill="#52605c"/>
  <rect x="6" y="19" width="7" height="7" fill="#101414"/>
  <!-- bottom-right: mint fill -->
  <rect x="18" y="18" width="9" height="9" fill="#8df7a4"/>
</svg>
